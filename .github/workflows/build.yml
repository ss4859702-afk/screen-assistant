name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/screenassistant
          cat > settings.gradle.kts <<'EOF_X'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ScreenAssistant"
          include(":app")
          EOF_X
          cat > build.gradle.kts <<'EOF_X'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_X
          cat > gradle.properties <<'EOF_X'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          kotlin.code.style=official
          EOF_X
          cat > app/build.gradle.kts <<'EOF_X'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.screenassistant"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.screenassistant"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_X
          cat > app/src/main/AndroidManifest.xml <<'EOF_X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="Screen Assistant"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF_X
          cat > app/src/main/java/com/example/screenassistant/MainActivity.kt <<'EOF_X'
          package com.example.screenassistant

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.text.InputType
          import android.view.ViewGroup
          import android.widget.*

          class MainActivity : Activity() {

              private lateinit var keyField: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val d = resources.displayMetrics.density
                  val pad = (20 * d).toInt()

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                  }
                  fun lp() = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply { topMargin = (12 * d).toInt() }

                  root.addView(TextView(this).apply {
                      text = "Screen Assistant"; textSize = 26f
                  })
                  root.addView(TextView(this).apply {
                      text = "ШІ, який дивиться на ваш екран і відповідає на питання.\n\n" +
                          "1. Введіть API-ключ Anthropic і натисніть «Почати».\n" +
                          "2. Дайте дозвіл на захоплення екрана (оберіть «Весь екран»).\n" +
                          "3. Відкрийте будь-який застосунок, потягніть шторку сповіщень і натисніть «📷 Знімок».\n" +
                          "4. Шторка сховається, знімок буде зроблено. Знову потягніть шторку, натисніть «✍ Питання», напишіть питання — відповідь з'явиться у сповіщенні."
                  }, lp())

                  keyField = EditText(this).apply {
                      hint = "API-ключ (sk-ant-...)"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      setText(getSharedPreferences("prefs", MODE_PRIVATE).getString("key", ""))
                  }
                  root.addView(keyField, lp())

                  root.addView(Button(this).apply {
                      text = "Почати"
                      setOnClickListener { onStartClicked() }
                  }, lp())
                  root.addView(Button(this).apply {
                      text = "Зупинити й відкликати дозвіл"
                      setOnClickListener {
                          startService(Intent(this@MainActivity, CaptureService::class.java).setAction(CaptureService.ACTION_STOP))
                          Toast.makeText(this@MainActivity, "Зупинено", Toast.LENGTH_SHORT).show()
                      }
                  }, lp())

                  setContentView(ScrollView(this).apply { addView(root) })

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
              }

              private fun onStartClicked() {
                  val key = keyField.text.toString().trim()
                  if (key.isEmpty()) {
                      Toast.makeText(this, "Введіть API-ключ", Toast.LENGTH_SHORT).show(); return
                  }
                  getSharedPreferences("prefs", MODE_PRIVATE).edit().putString("key", key).apply()

                  AlertDialog.Builder(this)
                      .setTitle("Дозвіл на сканування екрана")
                      .setMessage(
                          "Знімок екрана робиться ТІЛЬКИ коли ви натискаєте «📷 Знімок» у сповіщенні. " +
                          "Він надсилається до Anthropic API разом із вашим питанням, не зберігається на пристрої " +
                          "і видаляється з пам'яті після зупинки.\n\nНа екрані можуть бути особисті дані. Дозволити?"
                      )
                      .setPositiveButton("Дозволити") { _, _ ->
                          val mpm = getSystemService(MediaProjectionManager::class.java)
                          @Suppress("DEPRECATION")
                          startActivityForResult(mpm.createScreenCaptureIntent(), 100)
                      }
                      .setNegativeButton("Скасувати", null)
                      .show()
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  @Suppress("DEPRECATION")
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 100 && resultCode == RESULT_OK && data != null) {
                      val i = Intent(this, CaptureService::class.java)
                          .setAction(CaptureService.ACTION_START)
                          .putExtra(CaptureService.EXTRA_CODE, resultCode)
                          .putExtra(CaptureService.EXTRA_DATA, data)
                      startForegroundService(i)
                      Toast.makeText(this, "Готово! Потягніть шторку сповіщень.", Toast.LENGTH_LONG).show()
                  } else if (requestCode == 100) {
                      Toast.makeText(this, "Дозвіл не надано", Toast.LENGTH_SHORT).show()
                  }
              }
          }
          EOF_X
          cat > app/src/main/java/com/example/screenassistant/CaptureService.kt <<'EOF_X'
          package com.example.screenassistant

          import android.app.*
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.graphics.drawable.Icon
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.util.Base64
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicReference

          class CaptureService : Service() {

              companion object {
                  const val ACTION_START = "start"
                  const val ACTION_SNAP = "snap"
                  const val ACTION_ASK = "ask"
                  const val ACTION_STOP = "stop"
                  const val EXTRA_CODE = "code"
                  const val EXTRA_DATA = "data"
                  const val KEY_REPLY = "reply"
                  const val CHANNEL = "assistant"
                  const val NOTIF_ID = 1
                  const val MODEL = "claude-sonnet-5-5"
                  const val SYSTEM = "Ти помічник, який бачить знімок екрана користувача. " +
                      "Відповідай мовою питання, коротко і по суті. " +
                      "Не повторюй паролі, ключі та інші секрети, які видно на екрані."
              }

              private var projection: MediaProjection? = null
              private var reader: ImageReader? = null
              private var display: VirtualDisplay? = null
              private var thread: HandlerThread? = null
              private var handler: Handler? = null
              private val worker = Executors.newSingleThreadExecutor()
              private var lastShot: String? = null  // лише в пам'яті

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_START -> start(intent)
                      ACTION_SNAP -> snap()
                      ACTION_ASK -> {
                          val q = RemoteInput.getResultsFromIntent(intent)?.getCharSequence(KEY_REPLY)?.toString()
                          if (!q.isNullOrBlank()) ask(q)
                      }
                      ACTION_STOP -> {
                          cleanup()
                          stopForeground(STOP_FOREGROUND_REMOVE)
                          stopSelf()
                      }
                  }
                  return START_NOT_STICKY
              }

              // ---------- Запуск ----------
              private fun start(intent: Intent) {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel(CHANNEL, "Assistant", NotificationManager.IMPORTANCE_LOW))

                  val n = buildNotification("Готово. Натисніть «📷 Знімок», коли потрібно подивитись на екран.")
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else startForeground(NOTIF_ID, n)

                  val code = intent.getIntExtra(EXTRA_CODE, Activity.RESULT_CANCELED)
                  val data: Intent? = if (Build.VERSION.SDK_INT >= 33)
                      intent.getParcelableExtra(EXTRA_DATA, Intent::class.java)
                  else @Suppress("DEPRECATION") intent.getParcelableExtra(EXTRA_DATA)
                  if (data == null) { stopSelf(); return }

                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  val p = mpm.getMediaProjection(code, data)
                  projection = p
                  p.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { cleanup(); stopSelf() }
                  }, Handler(Looper.getMainLooper()))

                  thread = HandlerThread("capture").also { it.start() }
                  handler = Handler(thread!!.looper)

                  val dm = resources.displayMetrics
                  val r = ImageReader.newInstance(dm.widthPixels, dm.heightPixels, PixelFormat.RGBA_8888, 2)
                  reader = r
                  display = p.createVirtualDisplay(
                      "assistant", dm.widthPixels, dm.heightPixels, dm.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, r.surface, null, handler
                  )
                  display?.surface = null  // у спокої екран не знімається
              }

              // ---------- Знімок ----------
              private fun snap() {
                  notify("Роблю знімок…")
                  worker.execute {
                      try {
                          Thread.sleep(900)  // дати шторці сповіщень сховатись
                          lastShot = capture() ?: throw Exception("не вдалося зробити знімок")
                          notify("Знімок зроблено. Потягніть шторку й натисніть «✍ Питання».")
                      } catch (e: Exception) {
                          notify("Помилка: ${e.message}")
                      }
                  }
              }

              private fun capture(): String? {
                  val r = reader ?: return null
                  val d = display ?: return null
                  r.acquireLatestImage()?.close()  // скинути старі кадри
                  val result = AtomicReference<String?>(null)
                  val latch = CountDownLatch(1)

                  r.setOnImageAvailableListener({ rd ->
                      val img = rd.acquireLatestImage() ?: return@setOnImageAvailableListener
                      try {
                          if (result.get() == null) {
                              val p = img.planes[0]
                              val rowPadding = p.rowStride - p.pixelStride * img.width
                              val full = Bitmap.createBitmap(
                                  img.width + rowPadding / p.pixelStride, img.height, Bitmap.Config.ARGB_8888
                              )
                              full.copyPixelsFromBuffer(p.buffer)
                              val cropped = Bitmap.createBitmap(full, 0, 0, img.width, img.height)
                              val scale = minOf(1.0, 1280.0 / maxOf(cropped.width, cropped.height))
                              val small = Bitmap.createScaledBitmap(
                                  cropped, (cropped.width * scale).toInt(), (cropped.height * scale).toInt(), true
                              )
                              val out = ByteArrayOutputStream()
                              small.compress(Bitmap.CompressFormat.JPEG, 80, out)
                              result.set(Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP))
                              latch.countDown()
                          }
                      } finally { img.close() }
                  }, handler)

                  d.surface = r.surface          // вмикаємо захоплення
                  latch.await(3, TimeUnit.SECONDS)
                  d.surface = null               // одразу вимикаємо
                  r.setOnImageAvailableListener(null, null)
                  return result.get()
              }

              // ---------- Питання ----------
              private fun ask(question: String) {
                  val shot = lastShot
                  if (shot == null) { notify("Спершу натисніть «📷 Знімок»."); return }
                  notify("Думаю…")
                  worker.execute {
                      try { notify(callApi(question, shot)) }
                      catch (e: Exception) { notify("Помилка: ${e.message}") }
                  }
              }

              private fun callApi(question: String, b64: String): String {
                  val key = getSharedPreferences("prefs", MODE_PRIVATE).getString("key", "") ?: ""
                  val content = JSONArray()
                      .put(JSONObject().put("type", "image").put("source", JSONObject()
                          .put("type", "base64").put("media_type", "image/jpeg").put("data", b64)))
                      .put(JSONObject().put("type", "text").put("text", question))
                  val body = JSONObject()
                      .put("model", MODEL).put("max_tokens", 1000).put("system", SYSTEM)
                      .put("messages", JSONArray().put(JSONObject().put("role", "user").put("content", content)))

                  val c = URL("https://api.anthropic.com/v1/messages").openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.connectTimeout = 15000; c.readTimeout = 60000
                  c.doOutput = true
                  c.setRequestProperty("content-type", "application/json")
                  c.setRequestProperty("x-api-key", key)
                  c.setRequestProperty("anthropic-version", "2023-06-01")
                  c.outputStream.use { it.write(body.toString().toByteArray()) }

                  val ok = c.responseCode in 200..299
                  val text = (if (ok) c.inputStream else c.errorStream).bufferedReader().use { it.readText() }
                  if (!ok) throw Exception("API ${c.responseCode}: " +
                      runCatching { JSONObject(text).getJSONObject("error").getString("message") }.getOrDefault(text.take(200)))

                  val arr = JSONObject(text).getJSONArray("content")
                  return buildString {
                      for (i in 0 until arr.length()) {
                          val b = arr.getJSONObject(i)
                          if (b.getString("type") == "text") append(b.getString("text"))
                      }
                  }
              }

              // ---------- Сповіщення ----------
              private fun notify(text: String) {
                  getSystemService(NotificationManager::class.java).notify(NOTIF_ID, buildNotification(text))
              }

              private fun buildNotification(text: String): Notification {
                  fun svc(code: Int, action: String) = PendingIntent.getService(
           
